[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aimenle"
version = "0.1.0"
description = "Config-driven product data scraper"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
]

[project.scripts]
aimenle = "aimenle.cli:main"

[tool.setuptools.packages.find]
include = ["aimenle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
