# Example site config. books.toscrape.com is a sandbox site built for
# scraping practice, so it is safe to point the bot at it.
name: books_toscrape

start_urls:
  - https://books.toscrape.com/catalogue/page-1.html

delay: 1.0
max_pages: 5

item_selector: "article.product_pod"
next_selector: "li.next a"

fields:
  title:
    selector: "h3 a"
    attr: title
  url:
    selector: "h3 a"
    attr: href
  price:
    selector: ".price_color"
    type: price
  rating:
    selector: "p.star-rating"
    attr: class
    type: stars
  availability:
    selector: ".availability"
